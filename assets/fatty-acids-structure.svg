<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 207 220" role="img" aria-labelledby="title desc"><title id="title">三個脂肪酸分子的簡化結構</title><desc id="desc">三個分開的脂肪酸分子，分別為 R1C(=O)OH、R2C(=O)OH、R3C(=O)OH。R 代表烴鏈。</desc><style>text{font-family:Arial,"Noto Sans HK",sans-serif;fill:#24474a;font-size:19px;text-anchor:middle}.bond{stroke:#486b6b;stroke-width:2.5;stroke-linecap:round}.ester{stroke:#c77435;stroke-width:4;stroke-linecap:round}.carbonyl{stroke:#486b6b;stroke-width:2}.oxygen{fill:#087b78}.label{font-size:18px;font-weight:bold}.small{font-size:14px;fill:#658087}</style><text x="27" y="54" class="">R₁</text><line class="bond" x1="48" y1="48" x2="74" y2="48"/><text x="89" y="54" class="">C</text><line class="carbonyl" x1="85" y1="24" x2="85" y2="36"/><line class="carbonyl" x1="92" y1="24" x2="92" y2="36"/><text x="89" y="18" class="oxygen">O</text><line class="bond" x1="104" y1="48" x2="134" y2="48"/><text x="163" y="54" class="oxygen">OH</text><text x="27" y="128" class="">R₂</text><line class="bond" x1="48" y1="122" x2="74" y2="122"/><text x="89" y="128" class="">C</text><line class="carbonyl" x1="85" y1="98" x2="85" y2="110"/><line class="carbonyl" x1="92" y1="98" x2="92" y2="110"/><text x="89" y="92" class="oxygen">O</text><line class="bond" x1="104" y1="122" x2="134" y2="122"/><text x="163" y="128" class="oxygen">OH</text><text x="27" y="202" class="">R₃</text><line class="bond" x1="48" y1="196" x2="74" y2="196"/><text x="89" y="202" class="">C</text><line class="carbonyl" x1="85" y1="172" x2="85" y2="184"/><line class="carbonyl" x1="92" y1="172" x2="92" y2="184"/><text x="89" y="166" class="oxygen">O</text><line class="bond" x1="104" y1="196" x2="134" y2="196"/><text x="163" y="202" class="oxygen">OH</text></svg>