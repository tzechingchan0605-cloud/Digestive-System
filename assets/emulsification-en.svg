<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="title desc" lang="en"><title id="title">Bile (膽汁) emulsification (乳化作用): one large droplet becomes small droplets</title><desc id="desc">Nine identical lipid molecule symbols appear on each side. Emulsification (乳化作用) changes droplet size and dispersion without breaking down lipid molecules. Not to scale.</desc><style>text{font-family:Arial,"Noto Sans HK",sans-serif;fill:#24474a;font-size:19px;text-anchor:middle}.bond{stroke:#486b6b;stroke-width:2.5;stroke-linecap:round}.ester{stroke:#c77435;stroke-width:4;stroke-linecap:round}.carbonyl{stroke:#486b6b;stroke-width:2}.oxygen{fill:#087b78}.label{font-size:18px;font-weight:bold}.small{font-size:14px;fill:#658087}</style><g class="before-emulsification"><circle cx="118" cy="113" r="81" fill="#f3ca59" stroke="#dfb23c" stroke-width="2" /><g class="fat-molecule" transform="translate(75 77)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g><g class="fat-molecule" transform="translate(109 77)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g><g class="fat-molecule" transform="translate(143 77)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g><g class="fat-molecule" transform="translate(75 113)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g><g class="fat-molecule" transform="translate(109 113)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g><g class="fat-molecule" transform="translate(143 113)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g><g class="fat-molecule" transform="translate(75 149)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g><g class="fat-molecule" transform="translate(109 149)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g><g class="fat-molecule" transform="translate(143 149)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g></g><text x="118" y="232" class="label" style="font-size:14px"><tspan x="118" y="222">Lipid:</tspan><tspan x="118" y="240">one large oil droplet</tspan></text><text x="118" y="258" class="small" style="font-size:12px">Lipid molecules in one droplet</text><text x="307" y="82" class="label" style="font-size:14px">Bile (膽汁)</text><path d="M230 113H373l-12 -8m12 8-12 8" fill="none" stroke="#087b78" stroke-width="4" stroke-linecap="round" /><text x="307" y="147" class="small" style="font-size:12px">Emulsification (乳化作用)</text><g class="after-emulsification"><circle cx="436" cy="53" r="25" fill="#f3ca59" stroke="#dfb23c" stroke-width="2" /><g class="fat-molecule" transform="translate(427 53)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g><circle cx="502" cy="53" r="25" fill="#f3ca59" stroke="#dfb23c" stroke-width="2" /><g class="fat-molecule" transform="translate(493 53)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g><circle cx="568" cy="53" r="25" fill="#f3ca59" stroke="#d