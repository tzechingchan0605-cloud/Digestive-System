<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 475 104" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Three separate fatty acid (脂肪酸) molecules</title><desc id="desc">Three separately outlined molecules shown side by side: R1C(=O)OH, R2C(=O)OH and R3C(=O)OH. There are no bonds between the molecules.</desc><style>text{font-family:Arial,"Noto Sans HK",sans-serif;fill:#24474a;font-size:22px;text-anchor:middle}.bond{stroke:#486b6b;stroke-width:2.5;stroke-linecap:round}.carbonyl{stroke:#486b6b;stroke-width:2}.oxygen{fill:#087b78}.molecule-outline{fill:#fff;stroke:#c3d4ce;stroke-width:1.5}.plus{fill:#658087;font-size:24px}</style>
<g class="fatty-acid-molecule" id="fatty-acid-1" transform="translate(0 0)">
  <rect class="molecule-outline" x="1" y="3" width="146" height="98" rx="8"/>
  <text x="18" y="72">R₁</text><line class="bond" x1="33" y1="65" x2="54" y2="65"/>
  <text x="70" y="72">C</text><line class="carbonyl" x1="66" y1="34" x2="66" y2="53"/><line class="carbonyl" x1="74" y1="34" x2="74" y2="53"/>
  <text class="oxygen" x="70" y="25">O</text><line class="bond" x1="86" y1="65" x2="102" y2="65"/><text class="oxygen" x="124" y="72">OH</text>
</g>
<g class="fatty-acid-molecule" id="fatty-acid-2" transform="translate(164 0)">
  <rect class="molecule-outline" x="1" y="3" width="146" height="98" rx="8"/>
  <text x="18" y="72">R₂</text><line class="bond" x1="33" y1="65" x2="54" y2="65"/>
  <text x="70" y="72">C</text><line class="carbonyl" x1="66" y1="34" x2="66" y2="53"/><line class="carbonyl" x1="74" y1="34" x2="74" y2="53"/>
  <text class="oxygen" x="70" y="25">O</text><line class="bond" x1="86" y1="65" x2="102" y2="65"/><text class="oxygen" x="124" y="72">OH</text>
</g>
<g class="fatty-acid-molecule" id="fatty-acid-3" transform="translate(328 0)">
  <rect class="molecule-outline" x="1" y="3" width="146" height="98" rx="8"/>
  <text x="18" y="72">R₃</text><line class="bond" x1="33" y1="65" x2="54" y2="65"/>
  <text x="70" y="72">C</text><line class="carbonyl" x1="66" y1="34" x2="66" y2="53"/><line class="carbonyl" x1="74" y1="34" x2="74" y2="53"/>
  <text class="oxygen" x="70" y="25">O</text><line class="bond" x1="86" y1="65" x2="102" y2="65"/><text class="oxygen" x="124" y="72">OH</text>
</g>
<text class="plus" x="155" y="69">+</text><text class="plus" x="319" y="69">+</text>
</svg>
