<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 174 220" role="img" aria-labelledby="title desc" lang="en"><title id="title">Structure of glycerol (甘油)</title><desc id="desc">The three carbons in CH2OH, CHOH and CH2OH are joined by carbon–carbon bonds. After hydrolysis, the three oxygen atoms form hydroxyl groups.</desc><style>text{font-family:Arial,"Noto Sans HK",sans-serif;fill:#24474a;font-size:19px;text-anchor:middle}.bond{stroke:#486b6b;stroke-width:2.5;stroke-linecap:round}.ester{stroke:#c77435;stroke-width:4;stroke-linecap:round}.carbonyl{stroke:#486b6b;stroke-width:2}.oxygen{fill:#087b78}.label{font-size:18px;font-weight:bold}.small{font-size:14px;fill:#658087}</style><text x="48" y="54" class="">CH₂</text><line class="bond" x1="70" y1="48" x2="100" y2="48" /><text x="126" y="54" class="oxygen">OH</text><text x="48" y="128" class="">CH</text><line class="bond" x1="70" y1="122" x2="100" y2="122" /><text x="126" y="128" class="oxygen">OH</text><text x="48" y="202" class="">CH₂</text><line class="bond" x1="70" y1="196" x2="100" y2="196" /><text x="126" y="202" class="oxygen">OH</text><line class="bond" x1="48" y1="65" x2="48" y2="108" /><line class="bond" x1="48" y1="140" x2="48" y2="182" /></svg>