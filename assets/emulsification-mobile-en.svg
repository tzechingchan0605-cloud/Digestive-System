<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 638" role="img" aria-labelledby="title desc" lang="en"><title id="title">Bile (膽汁) emulsification (乳化作用): a large droplet becomes small droplets (vertical layout)</title><desc id="desc">The same nine lipid (脂質) molecule symbols appear before and after emulsification (乳化作用). Only droplet size changes; molecular structure stays the same. Not to scale.</desc><style>text{font-family:Arial,"Noto Sans HK",sans-serif;fill:#24474a;font-size:19px;text-anchor:middle}.bond{stroke:#486b6b;stroke-width:2.5;stroke-linecap:round}.ester{stroke:#c77435;stroke-width:4;stroke-linecap:round}.carbonyl{stroke:#486b6b;stroke-width:2}.oxygen{fill:#087b78}.label{font-size:18px;font-weight:bold}.small{font-size:14px;fill:#658087}</style><text x="170" y="25" class="label" style="font-size:14px">Lipid (脂質): one large oil droplet</text><g class="before-emulsification"><circle cx="170" cy="119" r="81" fill="#f3ca59" stroke="#dfb23c" stroke-width="2" /><g class="fat-molecule" transform="translate(127 83)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g><g class="fat-molecule" transform="translate(161 83)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g><g class="fat-molecule" transform="translate(195 83)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g><g class="fat-molecule" transform="translate(127 119)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g><g class="fat-molecule" transform="translate(161 119)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g><g class="fat-molecule" transform="translate(195 119)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g><g class="fat-molecule" transform="translate(127 155)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g><g class="fat-molecule" transform="translate(161 155)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g><g class="fat-molecule" transform="translate(195 155)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g></g><text x="252" y="248" class="label" style="font-size:16px">Bile (膽汁)</text><path d="M170 226V296l-8 -12m8 12 8 -12" fill="none" stroke="#087b78" stroke-width="4" stroke-linecap="round" /><text x="252" y="273" class="small" style="font-size:12px"><tspan x="252" y="265">Emulsification</tspan><tspan x="252" y="283">(乳化作用)</tspan></text><g class="after-emulsification"><circle cx="104" cy="344" r="25" fill="#f3ca59" stroke="#dfb23c" stroke-width="2" /><g class="fat-molecule" transform="translate(95 344)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g><circle cx="170" cy="344" r="25" fill="#f3ca59" stroke="#dfb23c" stroke-width="2" /><g class="fat-molecule" transform="translate(161 344)" fill="none" stroke="#8a6222" stroke-width="2.2" stroke-linecap="round"><path d="M0 -10V10M0 -8H6l4 -2 4 2 4 -2M0 0H6l4 -2 4 2 4 -2M0 8H6l4 -2 4 2 4 -2" /></g><circle cx="236" cy="344" r="25" fill="#f3ca59" stroke="#dfb23c" stroke-width="2" /><g class="fat-molecule" transform="translate(